<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Meetopia</title>
<link rel="icon" href="data:,">
<style>
:root{--cream:#F3EFE6;--wood:#8C6239;--wood-d:#5C4028;--olive:#5F6F52;--stone:#D6D3CD}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#F3EFE6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--wood-d);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
.panel{background:rgba(243,239,230,.88);border:1px solid rgba(92,64,40,.22);border-radius:12px;box-shadow:0 2px 10px rgba(60,40,20,.13);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn{font:inherit;font-weight:600;font-size:14px;background:var(--wood);color:var(--cream);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;box-shadow:0 2px 6px rgba(60,40,20,.2);transition:background .15s,transform .1s}
.btn:hover{background:var(--wood-d)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(243,239,230,.9);color:var(--wood-d);border:1px solid rgba(92,64,40,.25)}
.btn.ghost:hover{background:#fff}
.btn.big{padding:12px 20px;font-size:15px}
.btn.olive{background:var(--olive)}
.btn.olive:hover{background:#4B5941}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
#hud .panel,#hud button,#joy{pointer-events:auto}
#info{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));padding:8px 12px 9px;min-width:178px}
#area{font-weight:700;font-size:15px}
#clockRow{display:flex;align-items:baseline;gap:8px;margin-top:1px;flex-wrap:wrap}
#clk{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--olive);transition:transform .25s}
#clk.flash{transform:scale(1.12)}
#dayTxt,#phase{font-size:12px;opacity:.8}
#who{font-size:11px;opacity:.65;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
#tt{display:none;align-items:center;gap:5px;margin-top:7px;padding-top:7px;border-top:1px dashed rgba(92,64,40,.28);font-size:11px}
#tt span{opacity:.7;margin-right:2px}
#tt button{font:inherit;font-size:12px;font-weight:700;border:1px solid rgba(92,64,40,.3);background:#fff8;color:var(--wood-d);border-radius:8px;padding:3px 8px;cursor:pointer}
#tt button:hover{background:var(--olive);color:var(--cream);border-color:var(--olive)}
#topr{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#hint{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:6px 12px;font-size:12px;opacity:.9;white-space:nowrap}
#near{position:absolute;left:50%;bottom:max(52px,calc(env(safe-area-inset-bottom) + 40px));transform:translateX(-50%);padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#near small{font-weight:400;opacity:.7}
#act{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));min-width:112px;min-height:64px;font-size:17px;border-radius:16px;z-index:4}#tz{position:absolute;left:0;top:0;bottom:0;width:56%;display:none;touch-action:none;pointer-events:auto}body.touch #tz{display:block}body.mg-swat #tz{pointer-events:none}
#joy{position:absolute;left:22px;top:60%;width:124px;height:124px;border-radius:50%;background:rgba(92,64,40,.10);border:2px solid rgba(92,64,40,.22);display:none;pointer-events:none!important;opacity:.55;transition:opacity .12s}#joy.on{opacity:1;background:rgba(92,64,40,.16)}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(92,64,40,.55);box-shadow:0 2px 6px rgba(0,0,0,.2)}
body.touch #joy{display:block}body.touch .btn{min-height:42px}body.touch #toast{top:auto;bottom:calc(max(26px,env(safe-area-inset-bottom)) + 210px)}
body.touch #hint{display:none}
body.touch #near{bottom:calc(max(26px,env(safe-area-inset-bottom)) + 140px);max-width:80vw}

/* Setup */
#setup{position:fixed;inset:0;display:none;align-items:center;justify-content:flex-start;padding:20px 5vw;background:linear-gradient(90deg,rgba(243,239,230,.55),rgba(243,239,230,0) 62%)}
#setup.on{display:flex}
.card{width:392px;max-width:100%;max-height:94vh;overflow:auto;padding:20px 22px 18px;touch-action:pan-y;-webkit-user-select:auto;user-select:auto}
.card h1{margin:0;font-size:28px;letter-spacing:.5px;color:var(--olive)}
.card .sub{margin:2px 0 14px;font-size:13px;opacity:.7}
.card .fld{display:block;margin-bottom:11px;font-size:12px;font-weight:600}
.card input{width:100%;margin-top:4px;padding:9px 11px;font:inherit;font-size:16px;color:var(--wood-d);background:#fffdf8;border:1px solid rgba(92,64,40,.3);border-radius:9px;outline:none;-webkit-user-select:text;user-select:text}
.card input:focus{border-color:var(--olive);box-shadow:0 0 0 2px rgba(95,111,82,.25)}
.card .row{display:flex;align-items:center;gap:8px;margin-bottom:9px;min-height:32px}
.card .lbl{width:64px;font-size:12px;font-weight:600;flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid rgba(92,64,40,.3);background:#fffdf8;color:var(--wood-d);cursor:pointer}
.seg button.on{background:var(--olive);color:var(--cream);border-color:var(--olive)}
.sw{display:flex;gap:8px}
.sw button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(92,64,40,.35);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 2.5px var(--wood-d)}
.sec{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;margin:12px 0 7px;font-weight:700}
.card .btn.big{width:100%;margin-top:6px}
.link{display:block;margin:10px auto 0;background:none;border:0;font:inherit;font-size:12px;color:var(--wood);text-decoration:underline;cursor:pointer;opacity:.8}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
@media (max-aspect-ratio:1/1){
  #setup{align-items:flex-end;justify-content:center;padding:10px;background:linear-gradient(0deg,rgba(243,239,230,.5),rgba(243,239,230,0) 60%)}
  .card{max-height:60vh;width:min(440px,100%)}
}
@media (max-width:480px){#clk{font-size:20px}#info{min-width:0}#hint{font-size:11px}}

#coinRow{font-size:12px;margin-top:3px;font-weight:600}
#bossRow{font-size:11px;margin-top:2px}
#bossRow b{padding:1px 6px;border-radius:6px;background:rgba(95,111,82,.18)}
#bossRow b.bad{background:rgba(165,101,74,.25)}
#bossRow b.dead{background:rgba(92,64,40,.35)}
#qRow{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(92,64,40,.28);font-size:12px;font-weight:600;color:var(--olive);display:flex;align-items:center;gap:6px}
#qRow[hidden]{display:none}
#qArrow{display:inline-block;font-size:15px;color:var(--wood);transition:transform .1s}
#toast{position:fixed;left:50%;top:60px;transform:translate(-50%,-8px);z-index:18;background:rgba(92,64,40,.94);color:var(--cream);padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(40,28,18,.45)}
#modal.on{display:flex}
.mcard{width:430px;max-width:100%;max-height:92vh;overflow:auto;padding:16px 18px;touch-action:pan-y;-webkit-user-select:auto;user-select:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mh h2{margin:0;font-size:18px;color:var(--olive)}
.mh .x{background:none;border:0;font-size:20px;color:var(--wood-d);cursor:pointer;padding:4px 8px}
.wallet{font-size:14px;margin:4px 0 2px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed rgba(92,64,40,.22)}
.item small{display:block;font-size:12px;opacity:.7;margin-top:2px;line-height:1.3}
.item i{font-style:normal;font-size:11px;opacity:.7;margin-left:4px}
.item .btn{padding:7px 11px;font-size:13px;white-space:nowrap}
.item .btn:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:12px;opacity:.75;line-height:1.4;margin:8px 0 0}
#fade{position:fixed;inset:0;background:#2b2118;opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:20}
#fade.on{opacity:1;pointer-events:auto}
#err{position:fixed;left:12px;right:12px;top:12px;z-index:30;background:#A5654A;color:#fff;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.4}
/* ---- Chặng 3-4 ---- */
#btnVoucher b{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--olive);color:var(--cream);font-size:12px;line-height:20px;text-align:center}
#btnVoucher.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.18)}60%{transform:scale(.96)}}
#menu{display:flex;flex-direction:column;gap:6px;padding:8px}
#menu[hidden]{display:none}
#mg{position:absolute;left:50%;bottom:max(56px,calc(env(safe-area-inset-bottom) + 44px));transform:translateX(-50%);padding:8px 12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;max-width:92vw;z-index:5}
#mg[hidden]{display:none}
#mg .t{display:flex;flex-direction:column;line-height:1.25}
#mg .t small{font-weight:400;opacity:.75;font-size:11px}
#mg .btn{padding:6px 10px;font-size:12px;box-shadow:none;white-space:nowrap}
body.touch #mg{bottom:calc(max(26px,env(safe-area-inset-bottom)) + 140px)}
.fx{position:fixed;transform:translate(-50%,-50%);pointer-events:none;font-weight:800;font-size:15px;color:var(--wood-d);animation:fxup .7s ease-out forwards;z-index:16;text-shadow:0 1px 0 #fff8}
.fx.good{color:var(--olive);font-size:20px}
@keyframes fxup{from{opacity:1;transform:translate(-50%,-50%) scale(.8)}to{opacity:0;transform:translate(-50%,-150%) scale(1.15)}}
body.mg-swat #c{cursor:crosshair}
#senRow{font-size:11px;margin-top:2px}
#senRow b,#bossRow b#bLook{padding:1px 6px;border-radius:6px;background:rgba(95,111,82,.18)}
#senRow b.bad,#bossRow b#bLook.bad{background:rgba(165,101,74,.25)}
.cdline{color:var(--terra)}
.cdbar{display:block;height:5px;border-radius:3px;background:rgba(92,64,40,.15);margin-top:5px;overflow:hidden}
.cdbar[hidden]{display:none}
.cdbar span{display:block;height:100%;background:var(--olive);border-radius:3px;transition:width .3s linear}
.item small[hidden]{display:none}
.pnpc{padding:8px 10px;border-radius:10px;background:rgba(95,111,82,.13);font-size:13px;line-height:1.4;margin:4px 0}
.pnpc b{display:block;color:var(--olive);margin-bottom:2px}
.vcard{position:relative;margin:10px 0 4px;border-radius:14px;overflow:hidden;background:#FFFDF8;border:1px solid rgba(92,64,40,.3);box-shadow:0 3px 10px rgba(60,40,20,.18)}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--vc,#A5654A);color:#F3EFE6}
.vtop b{font-size:16px}
.vtop span{font-size:10px;letter-spacing:1px;opacity:.85;font-weight:700}
.vlive{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px;background:rgba(92,64,40,.07);font-size:12px}
.vlive b{font:700 16px ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--wood-d)}
.vdot{width:9px;height:9px;border-radius:50%;background:#5F6F52;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.vmain{padding:14px 14px 10px;text-align:center}
.voffer{font-size:28px;font-weight:800;color:var(--vc,#A5654A);line-height:1.1}
.vdesc{font-size:13px;opacity:.8;margin-top:6px;line-height:1.35}
.vperf{border-top:2px dashed rgba(92,64,40,.3);margin:4px 14px 0}
.vcode{padding:10px 14px 4px;text-align:center}
.vcode small{display:block;font-size:11px;opacity:.65;letter-spacing:1px;text-transform:uppercase}
.vcode b{display:block;margin:5px 0;padding:8px 10px;font:700 22px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;border:2px dashed var(--vc,#A5654A);border-radius:10px;color:var(--wood-d);background:#fff;-webkit-user-select:text;user-select:text;word-break:break-all}
.vstat{display:flex;justify-content:space-between;align-items:center;padding:4px 14px;font-size:13px}
.vstat b{font-variant-numeric:tabular-nums}
.chip{padding:2px 9px;border-radius:9px;font-size:12px;font-weight:700}
.chip.st-active,.stline.st-active{background:rgba(95,111,82,.2);color:var(--olive)}
.chip.st-used{background:rgba(92,64,40,.18)}
.chip.st-expired{background:rgba(165,101,74,.22);color:var(--terra)}
.stline{background:none!important}
.stline.st-used{color:var(--wood)}
.stline.st-expired{color:var(--terra)}
.vmeta{padding:0 14px 12px;text-align:center;font-size:11px;opacity:.7;line-height:1.4}
.vcard.st-used,.vcard.st-expired{filter:grayscale(.75);opacity:.85}
.vstamp{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%) rotate(-14deg);font-size:30px;font-weight:900;letter-spacing:3px;color:rgba(165,101,74,.8);border:4px solid rgba(165,101,74,.8);padding:4px 14px;border-radius:10px;background:rgba(255,253,248,.55);pointer-events:none}
.vsteps{margin:4px 0 0;padding-left:20px;font-size:13px;line-height:1.5}
.vsteps li{margin-bottom:4px}
.vsaved{margin:2px 0 4px;padding:6px 10px;border-radius:8px;background:rgba(95,111,82,.18);color:var(--olive);font-size:13px;font-weight:700}
.vbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vbtns .btn{flex:1;min-width:120px}
.vtabs{margin:6px 0 4px}
.vtabs button{flex:1}
.vrow .vdot2{width:8px;align-self:stretch;border-radius:4px;background:var(--vc,#A5654A);flex:none}
.vgrow{flex:1;min-width:0}
.vgrow code{font:700 12px ui-monospace,Menlo,Consolas,monospace}
#staffBox{display:flex;gap:8px;margin-top:10px}
#staffBox[hidden]{display:none}
#staffBox input{flex:1;min-width:0;padding:9px 11px;font-size:16px;border:1px solid rgba(92,64,40,.3);border-radius:9px;background:#fffdf8;color:var(--wood-d);outline:none;-webkit-user-select:text;user-select:text}
.sw.dress{margin:8px 0}
.sw.dress button{width:40px;height:40px}
/* ---- mở đầu ---- */
#intro{position:fixed;inset:0;z-index:12;display:none;align-items:flex-end;justify-content:center;padding:16px 16px max(22px,env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(243,239,230,.8),rgba(243,239,230,0) 70%)}
#intro.on{display:flex}
.icard{width:min(420px,100%);padding:18px 20px;text-align:center}
.icard h1{margin:0 0 6px;font-size:32px;letter-spacing:.5px;color:var(--olive)}
#inLines{min-height:78px;font-size:15px;line-height:1.45}
#inLines div{opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s}
#inLines div.show{opacity:1;transform:none}
.icard .btn.big{width:100%;margin-top:8px;min-height:50px;font-size:17px}
/* ---- chụp ảnh ---- */
#shotBar{display:none;position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right))}
body.shot #hud>*:not(#shotBar):not(#tz):not(#joy){display:none!important}
body.shot #shotBar{display:block}
#shotMark{position:fixed;left:14px;bottom:12px;z-index:6;display:none;font-weight:800;font-size:15px;letter-spacing:1px;color:var(--wood-d);text-shadow:0 1px 0 #fff9;opacity:.85;pointer-events:none}
body.shot #shotMark{display:block}
/* ---- màn hình ngang điện thoại ---- */
@media (max-height:520px){
  #info{padding:5px 9px 6px;min-width:0}#area{font-size:13px}#clk{font-size:18px}#who,#tt,#hint{display:none!important}
  #coinRow,#bossRow,#senRow{font-size:11px;margin-top:1px}#qRow{margin-top:3px;padding-top:3px;font-size:11px}
  body.touch #mg{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 4px);left:50%}
  #act{min-height:56px}.card{max-height:96vh}body.touch #near{bottom:10px;max-width:44vw}body.touch #toast{bottom:auto;top:10px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="info" class="panel">
    <div id="area">Quảng trường trung tâm</div>
    <div id="clockRow"><b id="clk">07:00</b><span id="dayTxt">Ngày 1</span><span id="phase">☀ Ban ngày</span></div>
    <div id="who"></div>
    <div id="coinRow">💰 <b id="coins">0</b> Sen Coin</div>
    <div id="bossRow">Boss: <b id="bAte">No</b> <b id="bMood">Bình thường</b> <b id="bLook">Sạch sẽ</b></div>
    <div id="senRow">Con Sen: <b id="sLook">Tươi tỉnh</b></div>
    <div id="qRow" hidden><span id="qTxt"></span><span id="qArrow">▲</span></div>
    <div id="tt"><span>Test giờ</span><button data-add="60">+1h</button><button data-add="240">+4h</button><button data-add="480">+8h</button></div>
  </div>
  <div id="tz"></div>
  <div id="topr">
    <button id="btnSwitch" class="btn olive">⇄ Vào Căn hộ</button>
    <button id="btnVoucher" class="btn ghost">🎫 Voucher<b id="vCount">0</b></button>
    <button id="btnMenu" class="btn ghost" aria-label="Menu">⋯</button>
    <div id="menu" class="panel" hidden><button id="mPhoto" class="btn ghost">📸 Chụp ảnh</button><button id="btnReset" class="btn ghost" title="Reset dữ liệu để test lại">⟲ Reset dữ liệu</button></div>
  </div>
  <div id="mg" class="panel" hidden><div class="t"><span id="mgTitle"></span><small id="mgStat"></small></div><button id="mgQuit" class="btn ghost">Bỏ cuộc</button></div>
  <div id="shotBar"><button id="shotExit" class="btn ghost">✕ Thoát chụp ảnh</button></div>
  <div id="near" class="panel" hidden></div>
  <div id="hint" class="panel">WASD / ↑↓←→ di chuyển · E tương tác</div>
  <button id="act" class="btn big" hidden>E · Vào</button>
  <div id="joy"><div id="knob"></div></div>
</div>

<div id="setup">
  <div class="card panel">
    <h1>Meetopia</h1>
    <p class="sub">Tạo nhân vật của bạn</p>
    <label class="fld">Tên hồ sơ
      <input id="inName" maxlength="14" placeholder="Nhập tên của bạn" autocomplete="off">
    </label>
    <div class="sec">Con Sen</div>
    <div class="row"><span class="lbl">Giới tính</span>
      <div class="seg" id="sgGender"><button data-v="m" class="on">Nam</button><button data-v="f">Nữ</button><button data-v="x">Khác</button></div></div>
    <div class="row"><span class="lbl">Màu da</span><div class="sw" id="swSkin"></div></div>
    <div class="row"><span class="lbl">Màu tóc</span><div class="sw" id="swHair"></div></div>
    <div class="row"><span class="lbl">Màu áo</span><div class="sw" id="swShirt"></div></div>
    <div class="sec">Boss (thú cưng)</div>
    <div class="row"><span class="lbl">Loài</span>
      <div class="seg" id="sgPet"><button data-v="dog" class="on">🐶 Chó</button><button data-v="cat">🐱 Mèo</button></div></div>
    <label class="fld">Tên Boss
      <input id="inPet" maxlength="12" placeholder="Boss" autocomplete="off">
    </label>
    <button id="btnStart" class="btn big">Bắt đầu →</button>
    <button id="btnWipe" class="link">Xóa dữ liệu đã lưu</button>
  </div>
</div>

<div id="intro"><div class="icard panel">
  <h1 id="inTitle">Meetopia</h1>
  <div id="inLines"></div>
  <button id="inGo" class="btn big">▶ Bắt đầu ngay</button>
  <button id="inSkip" class="link">Bỏ qua · tự tạo nhân vật</button>
</div></div>

<div id="modal"><div class="mcard panel" id="modalCard"></div></div>
<div id="shotMark">Meetopia · Con Sen &amp; Boss</div>

      } else {

        if (Math.abs(dx) < ex && Math.abs(dz) < ez) {

  var sk = u.fxStink; if (sk) for (i = 0; i < sk.length; i++) { var q = sk[i], ph = (time * 0.7 + q.s) % 1; q.m.position.set(q.x + Math.sin(ph * 9 + q.s) * 0.05, q.y + ph * 0.55, q.z); q.m.visible = ph < 0.85; }
}
function showBubble(mesh, text, y, dur, good) {
  var i; for (i = BUBBLES.length - 1; i >= 0; i--) if (BUBBLES[i].mesh === mesh) { mesh.remove(BUBBLES[i].sp); disposeLabels(BUBBLES[i].sp); BUBBLES.splice(i, 1); }
  var txt = wrapText(text, 20), nl = txt.split('\n').length;
  var sp = label(txt, { h: 0.34 * nl + 0.3, font: 40, bg: good ? 'rgba(238,246,226,0.98)' : 'rgba(255,255,255,0.97)', border: good ? '#5F6F52' : '#A5654A' });
  sp.userData = { bw: sp.scale.x, bh: sp.scale.y, pop: 0 }; sp.position.set(0, y + sp.scale.y / 2, 0); sp.scale.set(0.001, 0.001, 1);
  mesh.add(sp); BUBBLES.push({ sp: sp, mesh: mesh, t: dur || 4.4 });
}
function bubbleSen(text, good) { if (P.mesh) showBubble(P.mesh, text, 3.7, 4.6, good); }
function bubbleBoss(text, good) { if (B.mesh && B.mesh.visible) showBubble(B.mesh, text, B.mesh.userData.lh + 2.15, 4.6, good); }
function burst(mesh, n) {
  if (!mesh || !mesh.visible) return;
  if (!starTex) {
    var cv = document.createElement('canvas'); cv.width = cv.height = 64; var cx = cv.getContext('2d');
    var gr = cx.createRadialGradient(32, 32, 1, 32, 32, 30); gr.addColorStop(0, 'rgba(255,240,190,1)'); gr.addColorStop(0.35, 'rgba(255,205,110,0.9)'); gr.addColorStop(1, 'rgba(255,205,110,0)');
    cx.fillStyle = gr; cx.fillRect(0, 0, 64, 64); starTex = new THREE.CanvasTexture(cv);
  }
  for (var i = 0; i < n; i++) {
    var mat = new THREE.SpriteMaterial({ map: starTex, transparent: true, depthWrite: false, fog: false }), sp = new THREE.Sprite(mat), a = Math.random() * 6.28, v = 1.2 + Math.random() * 1.6;
    sp.position.set(mesh.position.x, mesh.position.y + 1.2 + Math.random() * 0.8, mesh.position.z); sp.scale.setScalar(0.5); sp.renderOrder = 11; scene.add(sp);
    FXP.push({ sp: sp, mat: mat, vx: Math.cos(a) * v, vy: 1.6 + Math.random() * 1.8, vz: Math.sin(a) * v, life: 0.9 + Math.random() * 0.4, t: 0 });
  }
}
function updateFX(dt) {
  var i;
  for (i = BUBBLES.length - 1; i >= 0; i--) {
    var b = BUBBLES[i], bu = b.sp.userData; bu.pop = Math.min(1, bu.pop + dt * 5); b.t -= dt;
    var e = bu.pop - 1, s = 1 + 2.7 * e * e * e + 1.7 * e * e; b.sp.scale.set(bu.bw * s, bu.bh * s, 1);
    if (b.t <= 0) { b.mesh.remove(b.sp); disposeLabels(b.sp); BUBBLES.splice(i, 1); }
  }
  for (i = FXP.length - 1; i >= 0; i--) {
    var f = FXP[i]; f.t += dt; f.vy -= 3 * dt; f.sp.position.x += f.vx * dt; f.sp.position.y += f.vy * dt; f.sp.position.z += f.vz * dt;
    var k = 1 - f.t / f.life; f.mat.opacity = Math.max(0, k); f.sp.scale.setScalar(0.25 + 0.5 * k);
    if (f.t >= f.life) { scene.remove(f.sp); f.mat.dispose(); FXP.splice(i, 1); }
  }
}
function renderCareHud() {
  var s = Math.max(0, CS.sen), b = Math.max(0, CS.boss), e = $('#sLook'), f = $('#bLook');
  e.textContent = CARE.senNames[s]; e.className = s >= 2 ? 'bad' : '';
  f.textContent = CARE.bossNames[b]; f.className = b >= 2 ? 'bad' : '';
}
function refreshCare(dt, time) {
  if (!P.mesh || !B.mesh || state.mode !== 'play' || !state.care) return;
  var ss = senStage(), bs = bossStage(), prev;
  if (ss !== CS.sen) { prev = CS.sen; CS.sen = ss; applySenLook(ss); renderCareHud(); if (prev >= 0 && ss > prev && ss >= 1) bubbleSen(pick(CONFIG.funny.sen[ss]), false); CS.nextSen = CARE.idleLineEverySec[0] + Math.random() * (CARE.idleLineEverySec[1] - CARE.idleLineEverySec[0]); }
  if (bs !== CS.boss) { prev = CS.boss; CS.boss = bs; applyBossLook(bs); renderCareHud(); BS.key = ''; refreshBoss(); if (prev >= 0 && bs > prev && bs >= 1) bubbleBoss(pick(CONFIG.funny.boss[bs]), false); CS.nextBoss = CARE.idleLineEverySec[0] + Math.random() * (CARE.idleLineEverySec[1] - CARE.idleLineEverySec[0]) + 6; }
  if (!state.modal && !MG) {
    CS.nextSen -= dt; CS.nextBoss -= dt;
    if (CS.nextSen <= 0) { CS.nextSen = CARE.idleLineEverySec[0] + Math.random() * (CARE.idleLineEverySec[1] - CARE.idleLineEverySec[0]); if (ss >= 1) bubbleSen(pick(CONFIG.funny.sen[ss]), false); }
    if (CS.nextBoss <= 0) { CS.nextBoss = CARE.idleLineEverySec[0] + Math.random() * (CARE.idleLineEverySec[1] - CARE.idleLineEverySec[0]) + 6; if (bs >= 1) bubbleBoss(pick(CONFIG.funny.boss[bs]), false); }
  }
  if (P.hop > 0) P.hop = Math.max(0, P.hop - dt);
}
function openDress() {
  var st = Math.max(0, CS.sen), cost = CARE.dressCost | 0;
  var h = '<div class="mh"><h2>👕 Tủ đồ của Con Sen</h2><button class="x" id="mClose">✕</button></div>';
  h += '<div class="wallet">💰 <b>' + state.coins + '</b> Sen Coin</div><p class="note" style="margin-top:2px">Ngoại hình hiện tại: <b>' + esc(CARE.senNames[st]) + '</b>. Tắm rửa + thay đồ là tươi tỉnh ngay!' + (cost ? ' Phí ' + cost + ' 💰.' : ' Miễn phí.') + '</p>';
  h += '<div class="sec">Chọn áo mới</div><div class="sw dress">';
  SHIRTS.forEach(function (c, i) { h += '<button data-dress="' + i + '" style="background:' + c + '"' + (state.profile.shirt === c ? ' class="on"' : '') + ' aria-label="Áo ' + (i + 1) + '"></button>'; });
  h += '</div><div class="vbtns"><button class="btn olive" data-dress="-1"' + (state.coins < cost ? ' disabled' : '') + '>🚿 Tắm rửa, giữ áo này</button></div>';
  showModal(h, 'dress');
}
function openBossCare() {
  var st = Math.max(0, CS.boss), cost = CARE.bossBathCost | 0, nm = esc(state.profile.petName);
  var h = '<div class="mh"><h2>🛁 Chăm sóc ' + nm + '</h2><button class="x" id="mClose">✕</button></div>';
  h += '<div class="wallet">💰 <b>' + state.coins + '</b> Sen Coin</div>';
  h += '<p class="note" style="margin-top:2px">' + nm + ' hiện: <b>' + esc(CARE.bossNames[st]) + '</b> · ' + ATE_TXT[BS.ate] + ' · ' + MOOD_TXT[BS.mood] + '. Thức ăn và đồ chơi mua ở Cửa hàng.</p>';
  h += '<div class="item"><div><b>🛁 Tắm và chải lông</b><small>Hết lấm lem, vui vẻ trở lại</small></div><button class="btn olive" data-care="boss"' + (state.coins < cost ? ' disabled' : '') + '>' + (cost ? cost + ' 💰' : 'Miễn phí') + '</button></div>';
  showModal(h, 'bosscare');
}
function careSen(idx) {
  var cost = CARE.dressCost | 0; if (state.coins < cost) { toast('Không đủ Sen Coin.'); return; }
  setCoins(state.coins - cost); state.care.lastSen = state.t;
  if (idx >= 0 && idx < SHIRTS.length) { state.profile.shirt = SHIRTS[idx]; rebuildPlayer(state.profile); restoreCarry(); }
  CS.sen = -1; closeModal(); refreshCare(0, 0);
  P.hop = 0.8; burst(P.mesh, 14); bubbleSen(pick(CONFIG.funny.senFresh), true); toast('✨ Con Sen tươi tỉnh trở lại!'); writeSave();
}
function careBoss() {
  var cost = CARE.bossBathCost | 0; if (state.coins < cost) { toast('Không đủ Sen Coin.'); return; }
  setCoins(state.coins - cost); state.care.lastBoss = state.t; state.boss.happyUntil = state.t + CONFIG.balance.happyAfterBuyMin;
  CS.boss = -1; BS.key = ''; closeModal(); refreshCare(0, 0); refreshBoss();
  burst(B.mesh, 14); bubbleBoss(pick(CONFIG.funny.bossFresh), true); toast('✨ ' + state.profile.petName + ' thơm tho, vui hẳn lên!'); writeSave();
}
function bossFedFx() { burst(B.mesh, 8); bubbleBoss(pick(CONFIG.funny.bossFed), true); }

/* ---- Menu, chụp ảnh ---- */
$('#btnMenu').addEventListener('click', function (e) { e.stopPropagation(); var m = $('#menu'); m.hidden = !m.hidden; });
document.addEventListener('click', function (e) { var m = $('#menu'); if (!m.hidden && !(e.target.closest && e.target.closest('#topr'))) m.hidden = true; });
$('#mPhoto').addEventListener('click', function () { $('#menu').hidden = true; document.body.classList.add('shot'); toast('📸 Chế độ chụp ảnh. Chạm ✕ để thoát.'); });
$('#shotExit').addEventListener('click', function () { document.body.classList.remove('shot'); });
$('#btnVoucher').addEventListener('click', function () { if (state.mode !== 'play' || busy || state.modal || MG) return; renderVouchers(); });

/* ---- Khởi tạo dữ liệu Chặng 3-4 khi vào game ---- */
function initStage3(saved) {
  state.cd = {}; state.vouchers = {};
  if (saved && saved.cd) CONFIG.jobOrder.forEach(function (k) { if (isFinite(saved.cd[k])) state.cd[k] = saved.cd[k]; });
  if (saved && saved.vouchers) Object.keys(CONFIG.vouchers).forEach(function (id) {
    var v = saved.vouchers[id];
    if (v && isFinite(v.ts) && typeof v.code === 'string') state.vouchers[id] = { code: v.code, ts: v.ts, gameT: v.gameT | 0, usedAt: isFinite(v.usedAt) ? v.usedAt : 0 };
  });
  var c = (saved && saved.care) || {};
  state.care = { lastSen: isFinite(c.lastSen) ? c.lastSen : state.t, lastBoss: isFinite(c.lastBoss) ? c.lastBoss : state.t };
  CS.sen = -1; CS.boss = -1; vBadgeN = -1; refreshVoucherBadge();
}

var boardT = 0, secT = 0;
function updateStage2(dt, time) {
  refreshBoss(); updateQuest(dt, time); updateQuestHUD(); updateMG(dt, time); refreshCare(dt, time);
  boardT += dt; if (boardT > 0.25) { boardT = 0; tickBoard(); tickVoucher(); }
  secT += dt; if (secT > 1) { secT = 0; refreshVoucherBadge(); }
}


/* ================= Khởi động ================= */
function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); aspect = w / h; camera.aspect = aspect; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); window.addEventListener('orientationchange', function () { setTimeout(resize, 150); });
resize();

var last = performance.now(), t0 = last;
function frame(now) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - last) / 1000); last = now;
  var time = (now - t0) / 1000;
  if (state.mode === 'play') {
    if (!busy) state.t += dt * GAME_RATE / 60;
    applyTime(state.t); updateHUDTime(false);
    updatePlayer(dt); updateStage2(dt, time); updatePet(dt); updateProximity();
  } else {
    applyTime(state.t);
  }
  updateNPCs(dt, time);
  if (P.mesh && B.mesh) animateChars(time);
  updateFX(dt);
  for (var i = 0; i < bobbers.length; i++) bobbers[i].o.position.y = bobbers[i].y + Math.sin(time * 2.4 + i) * 0.22;
  for (var j = 0; j < pulsers.length; j++) { var sc2 = 1 + Math.sin(time * 3 + j) * 0.08; pulsers[j].o.scale.set(sc2, 1, sc2); }
  updateCamera(dt, false);
  renderer.render(scene, camera);
}

/* ================= Màn hình mở đầu ================= */
var introTimers = [];
function showIntro() {
  var box = $('#inLines'); box.innerHTML = ''; $('#inTitle').textContent = CONFIG.intro.title; $('#intro').classList.add('on');
  CONFIG.intro.lines.forEach(function (ln, i) {
    var d = document.createElement('div'); d.textContent = ln; box.appendChild(d);
    introTimers.push(setTimeout(function () { d.classList.add('show'); }, 250 + i * CONFIG.intro.lineMs));
  });
}
function hideIntro() { introTimers.forEach(clearTimeout); introTimers = []; $('#intro').classList.remove('on'); }
function quickStart() {
  hideIntro(); var d = CONFIG.defaultProfile;
  startGame({ name: d.name, gender: d.gender, skin: SKINS[d.skin | 0], hair: HAIRS[d.hair | 0], shirt: SHIRTS[d.shirt | 0], pet: d.pet, petName: d.petName }, null);
}
$('#inGo').addEventListener('click', quickStart);
$('#inSkip').addEventListener('click', function () { hideIntro(); $('#setup').classList.add('on'); });

(function init() {
  var saved = loadSave();
  if (CONFIG.devTools || /[?&]dev=1/.test(location.search)) {
    $('#tt').style.display = 'flex';
    window.MT = { state: state, P: P, B: B, BS: BS, CS: CS, NPCS: NPCS, obsP: obsP, getMG: function () { return MG; }, getQ: function () { return Q; }, setArea: setArea, startQuest: startQuest, completeQuest: completeQuest, doAction: doAction, nearPoi: function () { return nearPoi; } };
  }

    plaza.visible = true; apt.visible = false;

})();
